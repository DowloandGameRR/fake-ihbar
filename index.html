<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İhbar Formu — PARODİ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:#0d1117;
    color:#c9d1d9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  /* Filigran */
  body::before {
    content:"HQS İHBAR -HQS İHBAR -HQS İHBAR -HQS İHBAR -";
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-32deg);
    font-size:64px;
    font-weight:900;
    color:rgba(255,70,85,0.06);
    white-space:nowrap;
    pointer-events:none;
    z-index:0;
    letter-spacing:8px;
  }
  .card {
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    background:#161b22;
    border:1px solid #21262d;
    border-radius:14px;
    padding:32px 28px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .parody-badge {
    display:inline-block;
    background:#ff4655;
    color:#fff;
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    padding:6px 14px;
    border-radius:20px;
    margin-bottom:18px;
    text-transform:uppercase;
  }
  h1 {
    font-size:24px;
    font-weight:800;
    color:#f0f6fc;
    margin-bottom:6px;
  }
  .sub {
    font-size:13px;
    color:#8b949e;
    margin-bottom:24px;
    line-height:1.5;
  }
  .parody-note {
    background:rgba(255,70,85,0.1);
    border-left:3px solid #ff4655;
    padding:12px 14px;
    border-radius:6px;
    font-size:12.5px;
    color:#ff9aa2;
    margin-bottom:24px;
    line-height:1.5;
  }
  label {
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#8b949e;
    margin-bottom:6px;
  }
  input, textarea, select {
    width:100%;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:8px;
    padding:12px 14px;
    color:#f0f6fc;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
    margin-bottom:16px;
  }
  input:focus, textarea:focus, select:focus {
    border-color:#ff4655;
    box-shadow:0 0 0 3px rgba(255,70,85,0.12);
  }
  textarea { resize:vertical; min-height:90px; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  button {
    width:100%;
    background:#ff4655;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:14px;
    font-size:14px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .2s, transform .1s;
    margin-top:6px;
  }
  button:hover { background:#e03a48; }
  button:active { transform:scale(0.98); }
  .result {
    display:none;
    margin-top:20px;
    background:rgba(56,139,253,0.1);
    border:1px solid rgba(56,139,253,0.3);
    border-radius:8px;
    padding:16px;
    font-size:13px;
    line-height:1.6;
    color:#79c0ff;
  }
  .result strong { color:#f0f6fc; display:block; margin-bottom:6px; }
  .footer {
    margin-top:20px;
    font-size:11px;
    color:#484f58;
    text-align:center;
    line-height:1.6;
    position:relative;
    z-index:1;
  }
</style>
</head>
<body>

<div class="card">
  <span class="parody-badge"> Nexa HQS ihbar</span>
  <h1>İhbar Formu</h1>
  <p class="sub">aşagıdaki bilgileri doldur..
  </p>

  <div class="parody-note">
    ⚠️ <strong>ihbar at</strong> NexaSal HQS ihbar
  </div>

  <form id="form">
    <div class="row">
      <div>
        <label>Ad</label>
        <input type="text" placeholder="Ad" required>
      </div>
      <div>
        <label>Soyad</label>
        <input type="text" placeholder="Soyad" required>
      </div>
    </div>

    <label>Konum</label>
    <input type="text" placeholder="Örn: Hayali Mahalle, Örnek Sokak No:0" required>

    <label>İhbar Konusu</label>
    <select>
      <option>taciz</option>
      <option>Uyuşturucu</option>
      <option>kaçakçılık</option>
      <option>tecavuz</option>
      <option>çocuk kaçırma</option>
    </select>

    <label>Açıklama</label>
    <textarea placeholder=" ihbarını buraya yaz..."></textarea>

    <button type="submit">İhbarı Gönder (Parodi)</button>
  </form>

  <div class="result" id="result">
    <strong>ihbar hazır beklemede kalın...</strong>
    ihbar yolda en kısa zamanda dönüş yapılacak en yakın dönüş tarihi 10-15 kasım 
  </div>
</div>

<div class="footer">
 
</div>

<script>
  document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const result = document.getElementById('result');
    result.style.display = 'block';
    this.style.display = 'none';
    result.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
</script>

</body>
</html>
